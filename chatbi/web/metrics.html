<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatBI · 指标管理</title><link rel="stylesheet" href="/static/styles.css?v=p2-1"></head>
<body>
<div class="app-frame">
  <aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">BI</span><span><strong>ChatBI</strong><small>智能数据分析</small></span></a>
    <nav class="nav-list"><a class="nav-item" href="/">智能问数</a><a class="nav-item active" href="/metrics">指标管理</a></nav>
    <div class="sidebar-section"><p>治理目录</p><div class="asset-row"><span>生效指标</span><strong id="metric-count">—</strong></div></div>
    <div class="sidebar-footer"><div><strong>本地管理模式</strong><small>版本留痕 · 依赖校验</small></div></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><p class="breadcrumb">数据工作台 / 指标语义层</p><h1>指标管理</h1></div><button id="new-metric" class="primary-button" type="button">新建指标</button></header>
    <div class="content">
      <section class="panel catalog-intro"><h2>让每一次查询使用同一套业务口径</h2><p>草稿 → 待审核 → 发布生效。已发布版本保持可追溯，修改时另建版本；废弃前检查下游依赖。</p><p class="notice">当前为本机单用户审批，操作人与审核人是审计标签。发布即生效，后续查询加载新口径。</p></section>
      <p id="catalog-message" role="status" aria-live="polite"></p>
      <div class="catalog-layout">
        <section class="panel catalog-list"><label for="metric-search">查找指标</label><input id="metric-search" type="search" placeholder="名称、责任人、状态"><div id="metric-list"></div></section>
        <section class="panel catalog-editor">
          <div class="panel-header"><div><h2 id="editor-title">新建指标草稿</h2><p id="editor-subtitle">填写定义和治理信息，保存后提交审核。</p></div></div>
          <form id="metric-form" class="metric-form">
            <label>指标名称<input name="name" required maxlength="80"></label>
            <label>责任人<input name="owner" required maxlength="80" placeholder="业务或数据负责人"></label>
            <label class="wide">业务定义<textarea name="definition" rows="2" required maxlength="2000"></textarea></label>
            <label class="wide">计算公式<textarea name="formula" rows="3" required maxlength="4000" placeholder="SQL 表达式或依赖指标表达式"></textarea></label>
            <label class="wide">数据来源与关联说明<textarea name="data_source" rows="2" required maxlength="2000"></textarea></label>
            <label class="wide">时间字段<input name="time_field" required maxlength="300" placeholder="例如 sales_orders.order_date"></label>
            <label>依赖指标（每行一个）<textarea name="depends_on" rows="3"></textarea></label>
            <label>别名（每行一个）<textarea name="aliases" rows="3"></textarea></label>
            <label class="wide">强制过滤条件（每行一个）<textarea name="filters" rows="2"></textarea></label>
            <label class="wide">本次变更说明<textarea name="change_note" rows="2" required maxlength="1000"></textarea></label>
            <div class="wide"><button type="submit" class="primary-button">保存为新草稿版本</button></div>
          </form>
          <section class="catalog-review"><h3>审核与发布</h3><div class="metric-form"><label>本次操作人<input id="review-actor" maxlength="80" placeholder="填写实际操作人"></label><label>操作说明<input id="review-note" maxlength="1000" placeholder="审核结论或废弃原因"></label></div><div id="metric-versions"><p class="notice">保存草稿后可以提交审核。</p></div></section>
          <section class="catalog-lineage"><h3>指标血缘</h3><div id="metric-lineage">选择指标查看上下游依赖。</div></section>
          <details class="catalog-audit"><summary>查看操作记录</summary><div id="metric-events"></div></details>
        </section>
      </div>
    </div>
  </main>
</div>
<script type="module" src="/static/metrics.mjs?v=p2-1"></script>
</body></html>
